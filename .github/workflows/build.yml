name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project SkiPDF.xcodeproj -scheme SkiPDF \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build > build.log 2>&1 || {
              grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line//$HOME/}"; done
              tail -40 build.log
              exit 1
            }

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/SkiPDF.app
          codesign -f -s - "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry SkiPDF.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SkiPDF-ipa
          path: SkiPDF.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ski PDF build ${{ github.run_number }}
          files: SkiPDF.ipa
          make_latest: true
          body: "Built from commit ${{ github.sha }}. Install through TestFlight (see README)."
